      - any-glob-to-any-file: 'src/services/fetchers/**'

notifier:
  - changed-files:
      - any-glob-to-any-file: 'src/services/notifier/**'

selector:
  - changed-files:
      - any-glob-to-any-file: 'src/services/selector/**'

storage:
  - changed-files:
      - any-glob-to-any-file: 'src/services/storage/**'

core:
  - changed-files:
      - any-glob-to-any-file: 'src/core/**'

cli:
  - changed-files:
      - any-glob-to-any-file: 'src/cli/**'

test:
