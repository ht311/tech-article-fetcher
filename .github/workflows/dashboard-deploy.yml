name: Deploy Dashboard to Cloudflare Pages

on:
  # auto-merge が GITHUB_TOKEN 経由のため push イベントが発火しない問題を回避。
  # PR close (= merged) イベントで代替する。
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "dashboard/**"
  # 直接 push（ホットフィックス等）と手動実行も引き続きサポート
  push:
    branches: [main]
    paths:
      - "dashboard/**"
  workflow_dispatch:

jobs:
  deploy:
    # PR close の場合は merged のときのみ実行
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - uses: pnpm/action-setup@v6
        with:
          version: "8.8.0"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: Build
        run: pnpm build
        working-directory: dashboard

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=tech-article-fetcher-dashboard
          workingDirectory: dashboard
