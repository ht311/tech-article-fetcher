name: Sync open PRs with main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Update or recreate open PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state open --json number,author -q '.[] | @base64' |
          while read -r row; do
            pr=$(echo "$row" | base64 -d | jq -r '.number')
            author=$(echo "$row" | base64 -d | jq -r '.author.login')

            if gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" >/dev/null 2>&1; then
              echo "PR #$pr: updated with latest main"
            elif [ "$author" = "app/dependabot" ]; then
              echo "PR #$pr: update failed (conflict) — requesting dependabot recreate"
              gh pr comment "$pr" --repo "$REPO" --body "@dependabot recreate"
            else
              echo "PR #$pr: update failed (conflict) — needs manual rebase (not a dependabot PR)"
            fi
          done
