name: Type Drift Detection

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: type-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-drift:
    name: Type Drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: "11.6.0"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Install Node deps
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: Regenerate types
        run: python scripts/gen_types.py

      - name: Check for drift
        run: |
          if ! git diff --exit-code dashboard/functions/api/_types.generated.ts; then
            echo ""
            echo "Type drift detected: _types.generated.ts is out of sync with src/core/models.py"
            echo "Run 'python scripts/gen_types.py' and commit the result."
            exit 1
          fi
