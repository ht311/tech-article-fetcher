[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-article-fetcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.10.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "line-bot-sdk>=3.23.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "mypy>=2.1.0",
    "pydantic-to-typescript>=2.0.0",
]

[project.scripts]
tech-article-fetcher = "src.cli.main:main"
tech-article-fetcher-seed = "src.cli.seed:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["feedparser", "linebot.*", "pydantic2ts", "bs4"]
ignore_missing_imports = true
